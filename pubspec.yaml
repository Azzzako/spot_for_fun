name: spot_for_fun
description: "Spot For Fun — mapa de spots para skaters."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  geolocator: ^13.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1

  google_sign_in: ^6.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample_spots/
    - assets/identity/
